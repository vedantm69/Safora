<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>SAFORA: Tourist Safety & AI Dispatch</title>
    
    <!-- React 18 UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script>window.React || document.write('<script src="./react.production.min.js"><\/script>')</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script>window.ReactDOM || document.write('<script src="./react-dom.production.min.js"><\/script>')</script>
    
    <!-- Leaflet CSS & JS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f1f3f7;
            min-height: 100vh;
            color: #0f172a;
        }
        .font-heading { font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; }
        .font-mono-data { font-family: 'JetBrains Mono', monospace; }
        
        .mobile-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-color: #f8fafc;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
            transition: max-width 0.25s ease;
        }

        /* Transformative Responsive Layout: Scales elegantly on Laptop / Desktop screens */
        @media (min-width: 640px) {
            .mobile-container {
                max-width: 640px;
            }
        }
        @media (min-width: 768px) {
            .mobile-container {
                max-width: 768px;
            }
        }
        @media (min-width: 1024px) {
            .mobile-container {
                max-width: 1040px;
                box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
            }
        }
        @media (min-width: 1280px) {
            .mobile-container {
                max-width: 1240px;
            }
        }
        @media (min-width: 1536px) {
            .mobile-container {
                max-width: 1360px;
            }
        }
        
        /* Radiating SOS Waves matching reference */
        @keyframes sosPulseRings {
            0% {
                transform: scale(0.92);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6), 0 0 0 0 rgba(239, 68, 68, 0.35);
            }
            60% {
                transform: scale(1.02);
                box-shadow: 0 0 0 22px rgba(220, 38, 38, 0.22), 0 0 0 45px rgba(220, 38, 38, 0);
            }
            100% {
                transform: scale(0.92);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0), 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }

        .sos-radiant-glow {
            animation: sosPulseRings 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .card-modern {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 1px solid rgba(241, 245, 249, 1);
            box-shadow: 0 8px 25px -6px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.02);
        }

        .ticker-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            position: relative;
        }
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: radarMarquee 35s linear infinite;
        }
        .ticker-content:hover, .ticker-content:active {
            animation-play-state: paused;
        }
        @keyframes radarMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .leaflet-container {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            border-radius: 1.5rem;
        }

        .nav-dock-shadow {
            box-shadow: 0 12px 35px -8px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(226, 232, 240, 0.9);
        }
    
        /* Laptop / PC: Forced Mobile Phone View Resolution */
        @media (min-width: 1024px) {
            .mobile-container.force-mobile-frame {
                max-width: 430px !important;
                width: 100% !important;
                height: 860px !important;
                max-height: calc(100vh - 40px) !important;
                margin: 20px auto !important;
                border-radius: 46px !important;
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 10px #0f172a, 0 0 0 12px #334155 !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
                position: relative !important;
                background-color: #f8fafc !important;
                padding: 0 !important;
            }
            .mobile-container.force-mobile-frame .md\:grid-cols-2,
            .mobile-container.force-mobile-frame .lg\:grid-cols-2,
            .mobile-container.force-mobile-frame .lg\:grid-cols-3,
            .mobile-container.force-mobile-frame .md\:grid-cols-3 {
                grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
            }
            .mobile-container.force-mobile-frame nav[data-nav-dock="true"] {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                margin: 0 !important;
                bottom: 0 !important;
            }
            #mobile-frame-scroll-body {
                scrollbar-width: thin;
                scrollbar-color: #cbd5e1 transparent;
            }
            #mobile-frame-scroll-body::-webkit-scrollbar {
                width: 4px;
            }
            #mobile-frame-scroll-body::-webkit-scrollbar-thumb {
                background-color: #cbd5e1;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body class="bg-slate-100 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root">
        <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:sans-serif;gap:14px;">
            <div style="width:56px;height:56px;border-radius:20px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#ffffff;font-weight:900;font-size:24px;box-shadow:0 10px 25px -5px rgba(15,23,42,0.2);">
                S
            </div>
            <p style="font-size:15px;font-weight:800;letter-spacing:-0.2px;color:#0f172a;">SAFORA</p>
        </div>
    </div>
    <script src="./tourist_app.js?v=1790328000000"></script>
</body>
</html>
