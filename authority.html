    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #06090e; background-image: radial-gradient(circle at 50% 0%, rgba(16,185,129,0.12), transparent 45%), radial-gradient(circle at 10% 40%, rgba(14,165,233,0.08), transparent 40%), radial-gradient(circle at 90% 80%, rgba(244,63,94,0.06), transparent 35%); background-attachment: fixed; min-height: 100vh; color: #f1f5f9; }
        .font-heading { font-family: 'Outfit', sans-serif; }
        .font-mono-data { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(15,23,42,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .glass-panel-glow { background: rgba(15,23,42,0.85); backdrop-filter: blur(24px); border: 1px solid rgba(16,185,129,0.25); box-shadow: 0 10px 30px -10px rgba(16,185,129,0.2); }
        .glass-panel-danger { background: radial-gradient(circle at top left, rgba(239,68,68,0.15), rgba(15,23,42,0.9)); backdrop-filter: blur(24px); border: 1px solid rgba(239,68,68,0.35); box-shadow: 0 10px 35px -10px rgba(239,68,68,0.25); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15,23,42,0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51,65,85,0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16,185,129,0.6); }
        .typing-dot { animation: typingAnimation 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingAnimation { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
        .shimmer-badge { background: linear-gradient(90deg, rgba(16,185,129,0.1) 0%, rgba(16,185,129,0.3) 50%, rgba(16,185,129,0.1) 100%); background-size: 200% 100%; animation: shimmer 3s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .sound-wave { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
        .sound-bar { width: 3px; background: currentColor; border-radius: 2px; animation: soundBounce 1s ease-in-out infinite alternate; }
        .sound-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .sound-bar:nth-child(2) { height: 80%; animation-delay: 0.3s; }
        .sound-bar:nth-child(3) { height: 100%; animation-delay: 0.2s; }
        .sound-bar:nth-child(4) { height: 60%; animation-delay: 0.4s; }
        @keyframes soundBounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
    </style>
